<div class="perfil-publico-page">

    <app-sidebar></app-sidebar>

    <main class="perfil-publico-content">

        <div class="page-title">

            <h1>Perfil Público</h1>

            <p>
                Visualize como seu perfil aparece para outros usuários.
            </p>

        </div>


        <section class="perfil-publico-card">

            <div class="perfil-avatar">

                <img
                    *ngIf="avatarUrl"
                    [src]="avatarUrl"
                    alt="Avatar"
                    class="perfil-avatar-foto"
                >

                <span *ngIf="!avatarUrl">
                    <i class="bi bi-person-fill"></i>
                </span>

            </div>


            <div class="perfil-info">

                <h2>{{ nome || 'Usuário' }}</h2>

                <span>{{ arroba }}</span>

                <p *ngIf="biografia">
                    {{ biografia }}
                </p>

                <p *ngIf="!biografia && !carregando">
                    Este usuário ainda não adicionou uma biografia.
                </p>

                <div class="perfil-links" *ngIf="listaLinks.length > 0">

                    <span *ngFor="let link of listaLinks">
                        {{ link }}
                    </span>

                </div>

            </div>


            <div class="perfil-estatisticas">

                <div>
                    <strong>{{ titulos }}</strong>
                    <span>Títulos</span>
                </div>

                <div>
                    <strong>{{ publicacoes }}</strong>
                    <span>Publicações</span>
                </div>

                <div>
                    <strong>{{ colecoes }}</strong>
                    <span>Coleções</span>
                </div>

                <div>
                    <strong>{{ grupos }}</strong>
                    <span>Grupos</span>
                </div>

            </div>

        </section>

    </main>

</div>
